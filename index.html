<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="header">
        <h1>🎓 Student Portal</h1>
        <p>Manage your student records</p>
    </div>

    <div class="container">
        
        <!-- Stats Section -->
        <div class="stats">
            <div class="stat-box">
                <h2 id="total">0</h2>
                <p>Total Students</p>
            </div>
            <div class="stat-box">
                <h2 id="avgGpa">0.0</h2>
                <p>Average GPA</p>
            </div>
            <div class="stat-box">
                <h2 id="toppers">0</h2>
                <p>Top Students (GPA > 8.5)</p>
            </div>
        </div>

        <!-- Search and Add -->
        <div class="controls">
            <input type="text" id="search" placeholder="Search by name or roll no...">
            <button onclick="openModal()">Add Student</button>
        </div>

        <!-- Students List -->
        <div id="studentList" class="student-grid"></div>

        <div id="noData" class="empty">
            <p>No students added yet. Click "Add Student" to start!</p>
        </div>

    </div>

    <!-- Add/Edit Modal -->
    <div id="modal" class="modal">
        <div class="modal-box">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Add Student</h2>
            
            <form id="studentForm">
                <label>Roll Number</label>
                <input type="text" id="rollNo" required>

                <label>Name</label>
                <input type="text" id="name" required>

                <label>Email</label>
                <input type="email" id="email" required>

                <label>Department</label>
                <select id="dept" required>
                    <option value="">Select</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                    <option value="B.Tech">B.Tech</option>
                    <option value="B.Sc">B.Sc</option>
                </select>

                <label>GPA</label>
                <input type="number" id="gpa" step="0.1" min="0" max="10" required>

                <label>Phone (optional)</label>
                <input type="tel" id="phone">

                <div class="form-buttons">
                    <button type="button" onclick="closeModal()">Cancel</button>
                    <button type="submit">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div class="footer">
        <p>Built by Tharun R | BCA Project 2026</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
